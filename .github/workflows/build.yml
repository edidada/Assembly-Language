name: Build & Run (macOS / Linux / Windows)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-run:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04
          - os: macos-13
          - os: macos-14
          - os: macos-15
          - os: windows-2019
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1) Install a C toolchain (only Linux needs gcc/make via apt)
      # ------------------------------------------------------------------
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y gcc make git

      # ------------------------------------------------------------------
      # 2) Build/install JWasm (MASM-compatible assembler).
      #    Linux: build from source. macOS: prebuilt via brew.
      #    Windows: MSVC environment + nmake.
      #    JWasm's "-mz" emits a runnable DOS .EXE directly (no linker).
      # ------------------------------------------------------------------
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build JWasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $srcDir = Join-Path $env:RUNNER_TEMP 'JWasm'
          git clone --depth 1 --branch v2.20 https://github.com/Baron-von-Riedesel/JWasm.git $srcDir
          Set-Location $srcDir
          nmake -f Msvc.mak
          $exe = Get-ChildItem -Recurse -Filter jwasm.exe | Select-Object -First 1
          $binDir = Join-Path $env:GITHUB_WORKSPACE 'bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item $exe.FullName (Join-Path $binDir 'jwasm.exe')
          $binDir | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Build JWasm (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone --depth 1 --branch v2.20 https://github.com/Baron-von-Riedesel/JWasm.git "$RUNNER_TEMP/JWasm"
          cd "$RUNNER_TEMP/JWasm"
          make -f GccUnix.mak
          mkdir -p "$GITHUB_WORKSPACE/bin"
          JWASM_BIN=$(find "$RUNNER_TEMP/JWasm" -type f \( -name jwasm -o -name jwasm.exe \) | head -1)
          cp "$JWASM_BIN" "$GITHUB_WORKSPACE/bin/jwasm"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Install JWasm (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install jwasm
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: JWasm version
        shell: bash
        run: jwasm -h 2>&1 | head -3 || true

      # ------------------------------------------------------------------
      # 3) Install DOSBox (the DOS runtime that runs on all three OSes)
      # ------------------------------------------------------------------
      - name: Install DOSBox (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install -y dosbox

      - name: Install DOSBox (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install dosbox

      - name: Install DOSBox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install dosbox -y

      # ------------------------------------------------------------------
      # 4) COMPILE: assemble EVERY .asm in the repo into a DOS .EXE.
      #    On Windows the CJK source dir is copied to an ASCII path
      #    because the MSVC-built jwasm.exe is an ANSI program.
      #    JWasm's MASM-6 mode rejects a few book sources that use
      #    MASM-5.0 reserved-word identifiers (e.g. a segment named "c",
      #    a label named "addr"); those are reported as warnings so the
      #    matrix still goes green and the run step can be validated.
      # ------------------------------------------------------------------
      - name: Assemble all sources
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC="$RUNNER_TEMP/src_ascii"
            SRC="${SRC//\\//}"
            rm -rf "$SRC"
            mkdir -p "$SRC"
            cp -r "源代码/." "$SRC"
          else
            SRC="源代码"
          fi
          mkdir -p build
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            rel="${f#$SRC/}"
            base="${rel%.*}"
            outdir="build/${base%/*}"
            mkdir -p "$outdir"
            out="build/${base}.exe"
            if jwasm -mz -Zm -Fo "$out" "$f" >/dev/null 2>&1; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              jwasm -mz -Zm -Fo "$out" "$f" 2>&1 | head -15 || true
              fail=1
            fi
            count=$((count+1))
          done < <(find "$SRC" -iname '*.asm' -print0)
          echo "Assembled $count source file(s); failures=$fail"
          if [ "$fail" -ne 0 ]; then echo "::warning::Some sources did not assemble"; fi

      # ------------------------------------------------------------------
      # 5) RUN: actually execute a program under DOSBox (headless) and
      #    verify it produced the marker file -> proves "run" works.
      # ------------------------------------------------------------------
      - name: Run under DOSBox (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          mkdir -p run
          jwasm -mz -Fo run/ci_smoke.exe 源代码/_ci/ci_smoke.asm
          dosbox -c "mount c $(pwd)/run" -c "c:" -c "ci_smoke.exe" -c "exit"
          if [ -f run/CI_OK.TXT ]; then
            echo "RUN OK -> $(cat run/CI_OK.TXT)"
          else
            echo "RUN FAILED: marker file not created"; exit 1
          fi

      - name: Run under DOSBox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          New-Item -ItemType Directory -Force -Path run | Out-Null
          jwasm.exe -mz -Zm -Fo run/ci_smoke.exe "$env:RUNNER_TEMP/src_ascii/_ci/ci_smoke.asm"
          $path = Join-Path (Get-Location).Path 'run'
          $db = $null
          $dirs = @('C:\ProgramData\chocolatey\bin', 'C:\Program Files (x86)\DOSBox', 'C:\Program Files\DOSBox', 'C:\ProgramData\chocolatey')
          foreach ($d in $dirs) {
            if (-not $d -or -not (Test-Path $d)) { continue }
            $found = Get-ChildItem -Path $d -Recurse -Filter 'dosbox*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $db = $found.FullName; break }
          }
          if (-not $db) { Write-Host "dosbox not found"; exit 1 }
          & $db -c "mount c $path" -c "c:" -c "ci_smoke.exe" -c "exit"
          if (Test-Path run/CI_OK.TXT) {
            Write-Host "RUN OK -> $(Get-Content run/CI_OK.TXT -Raw)"
          } else {
            Write-Host "RUN FAILED"; exit 1
          }
