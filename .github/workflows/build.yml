name: Build & Run (macOS / Linux / Windows)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-run:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04
          - os: macos-15
          - os: macos-26
          - os: windows-2022
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    # A sane upper bound in case DOSBox ever fails to quit by itself.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1) Install a C toolchain (only Linux needs gcc/make via apt)
      # ------------------------------------------------------------------
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y gcc make git

      # ------------------------------------------------------------------
      # 2) Build/install JWasm (MASM-compatible assembler).
      #    Linux/macOS: build from source (Homebrew no longer ships a
      #    "jwasm" formula). Windows: MSVC environment + nmake.
      #    JWasm's "-mz" emits a runnable DOS .EXE directly (no linker).
      # ------------------------------------------------------------------
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build JWasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $srcDir = Join-Path $env:RUNNER_TEMP 'JWasm'
          git clone --depth 1 --branch v2.20 https://github.com/Baron-von-Riedesel/JWasm.git $srcDir
          Set-Location $srcDir
          nmake -f Msvc.mak
          $exe = Get-ChildItem -Recurse -Filter jwasm.exe | Select-Object -First 1
          $binDir = Join-Path $env:GITHUB_WORKSPACE 'bin'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item $exe.FullName (Join-Path $binDir 'jwasm.exe')
          $binDir | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Build JWasm (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS has no <malloc.h>; provide a shim that gives JWasm the
            # two things it needs from it: malloc()/free() and alloca().
            mkdir -p "$RUNNER_TEMP/inc"
            printf '#include <stdlib.h>\n#include <alloca.h>\n' > "$RUNNER_TEMP/inc/malloc.h"
            export CPATH="$RUNNER_TEMP/inc"
          fi
          git clone --depth 1 --branch v2.20 https://github.com/Baron-von-Riedesel/JWasm.git "$RUNNER_TEMP/JWasm"
          cd "$RUNNER_TEMP/JWasm"
          make -f GccUnix.mak
          mkdir -p "$GITHUB_WORKSPACE/bin"
          JWASM_BIN=$(find "$RUNNER_TEMP/JWasm" -type f \( -name jwasm -o -name jwasm.exe \) | head -1)
          cp "$JWASM_BIN" "$GITHUB_WORKSPACE/bin/jwasm"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: JWasm version
        shell: bash
        run: jwasm -h 2>&1 | head -3 || true

      # ------------------------------------------------------------------
      # 3) Install DOSBox (the DOS runtime that runs on all three OSes).
      #    Homebrew's "dosbox" formula was removed; dosbox-staging is the
      #    maintained replacement and also installs a "dosbox" binary.
      # ------------------------------------------------------------------
      - name: Install DOSBox (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install -y dosbox

      - name: Install DOSBox (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install dosbox-staging

      - name: Install DOSBox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install dosbox -y

      # ------------------------------------------------------------------
      # 4) COMPILE: assemble EVERY .asm in the repo into a DOS .EXE.
      #    On Windows the CJK source dir is copied to an ASCII path
      #    because the MSVC-built jwasm.exe is an ANSI program.
      #    Book sources that use MASM-5.0 reserved words as identifiers
      #    declare "option nokeyword:<...>" in the source itself, so a
      #    failure here means a real regression and fails the build.
      # ------------------------------------------------------------------
      - name: Assemble all sources
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC="$RUNNER_TEMP/src_ascii"
            SRC="${SRC//\\//}"
            rm -rf "$SRC"
            mkdir -p "$SRC"
            cp -r "源代码/." "$SRC"
          else
            SRC="源代码"
          fi
          mkdir -p build
          count=0
          failed=0
          while IFS= read -r -d '' f; do
            rel="${f#$SRC/}"
            base="${rel%.*}"
            outdir="build/${base%/*}"
            mkdir -p "$outdir"
            out="build/${base}.exe"
            if jwasm -mz -Zm -Fo "$out" "$f" >/dev/null 2>&1; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              echo "::error file=$f::assembly failed"
              jwasm -mz -Zm -Fo "$out" "$f" 2>&1 | head -15 || true
              failed=$((failed+1))
            fi
            count=$((count+1))
          done < <(find "$SRC" -iname '*.asm' -print0)
          echo "Assembled $count source file(s); failures=$failed"
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed source file(s) did not assemble"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 5) RUN: actually execute a program under DOSBox (headless) and
      #    verify it produced the marker file -> proves "run" works.
      # ------------------------------------------------------------------
      - name: Run under DOSBox (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          mkdir -p run
          rm -f run/CI_OK.TXT
          jwasm -mz -Fo run/ci_smoke.exe 源代码/_ci/ci_smoke.asm
          dosbox -c "mount c $(pwd)/run" -c "c:" -c "ci_smoke.exe" -c "exit"
          if [ -f run/CI_OK.TXT ]; then
            echo "RUN OK -> $(cat run/CI_OK.TXT)"
          else
            echo "RUN FAILED: marker file not created"; exit 1
          fi

      - name: Run under DOSBox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path run | Out-Null
          Remove-Item run/CI_OK.TXT -ErrorAction SilentlyContinue
          jwasm.exe -mz -Zm -Fo run/ci_smoke.exe "$env:RUNNER_TEMP/src_ascii/_ci/ci_smoke.asm"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Use the real executable, not the console shim in
          # C:\ProgramData\chocolatey\bin (which returns immediately).
          $db = Get-ChildItem @(
            'C:\Program Files (x86)\DOSBox*',
            'C:\Program Files\DOSBox*'
          ) -Recurse -Filter dosbox.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $db) { Write-Host "dosbox not found"; exit 1 }
          Write-Host "Using DOSBox: $db"

          $path = Join-Path (Get-Location).Path 'run'
          $dosArgs = @('-c', "mount c $path", '-c', 'c:', '-c', 'ci_smoke.exe', '-c', 'exit')
          $proc = Start-Process -FilePath $db -ArgumentList $dosArgs -PassThru
          if (-not $proc.WaitForExit(120000)) {
            $proc.Kill()
            Write-Host "RUN FAILED: DOSBox timed out"
            exit 1
          }
          if (Test-Path run/CI_OK.TXT) {
            Write-Host "RUN OK -> $(Get-Content run/CI_OK.TXT -Raw)"
          } else {
            Write-Host "RUN FAILED: marker file not created"
            exit 1
          }
